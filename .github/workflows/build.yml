name: Game quality gates
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install reproducible dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Validate game data and release invariants
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload production build for preview/release review
        uses: actions/upload-artifact@v4
        with:
          name: pixel-adventure-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7
